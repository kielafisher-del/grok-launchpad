<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal & Finance Bots</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root { --accent: #6d28d9; --text: #111827; --muted: #4b5563; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f4f5f7; color: var(--text); min-height: 100vh; padding: 2.5rem 1.5rem 4rem; }
    header { max-width: 1120px; margin: 0 auto 2.5rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: 700; } .logo span { color: var(--accent); }
    .back { color: var(--accent); text-decoration: none; font-weight: 500; font-size: 0.95rem; }
    h1 { max-width: 1120px; margin: 0 auto 1.75rem; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; color: #5b21b6; }
    .grid { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.1rem; }
    .tile {
      background: #c4b5fd;
      border: 1px solid #a78bfa;
      border-radius: 20px;
      padding: 1.6rem 1rem;
      text-align: center;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      min-height: 150px;
      justify-content: center;
    }
    .tile:hover { background: #a78bfa; transform: translateY(-4px); box-shadow: 0 12px 32px rgba(124,58,237,0.28); }
    .icon { width: 36px; height: 36px; color: var(--accent); stroke-width: 1.75; }
    .label { font-weight: 600; font-size: 0.95rem; line-height: 1.25; }
    .sub { font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="logo">Grok<span>Launchpad</span></div>
    <a class="back" href="index.html">← Back</a>
  </header>
  <h1>Personal & Finance Bots</h1>
  <div class="grid">
    <a class="tile" href="https://grok.com" target="_blank"><i data-lucide="mail" class="icon"></i><div class="label">Email Bot</div><div class="sub">Inbox priorities</div></a>
    <a class="tile" href="https://grok.com" target="_blank"><i data-lucide="receipt" class="icon"></i><div class="label">Bills Bot</div><div class="sub">Statements & dues</div></a>
    <a class="tile" href="https://grok.com" target="_blank"><i data-lucide="credit-card" class="icon"></i><div class="label">Credit Card Max</div><div class="sub">Points & cards</div></a>
    <a class="tile" href="https://grok.com" target="_blank"><i data-lucide="line-chart" class="icon"></i><div class="label">Congress Mirror</div><div class="sub">Trade tracking</div></a>
    <a class="tile" href="https://grok.com" target="_blank"><i data-lucide="phone-off" class="icon"></i><div class="label">Spam-Call Scrubber</div><div class="sub">Opt-outs</div></a>
    <a class="tile" href="https://grok.com" target="_blank"><i data-lucide="sticker" class="icon"></i><div class="label">Free Stickers Bot</div><div class="sub">Monthly signups</div></a>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
