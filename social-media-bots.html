<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media Bots</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root { --accent: #1d4ed8; --text: #111827; --muted: #4b5563; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f4f5f7; color: var(--text); min-height: 100vh; padding: 2.5rem 1.5rem 4rem; }
    header { max-width: 1120px; margin: 0 auto 2.5rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: 700; } .logo span { color: var(--accent); }
    .back { color: var(--accent); text-decoration: none; font-weight: 500; font-size: 0.95rem; }
    h1 { max-width: 1120px; margin: 0 auto 1.75rem; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; color: #1e40af; }
    .grid { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.1rem; }
    .tile {
      background: #93c5fd;
      border: 1px solid #60a5fa;
      border-radius: 20px;
      padding: 1.6rem 1rem;
      text-align: center;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      min-height: 150px;
      justify-content: center;
    }
    .tile:hover { background: #60a5fa; transform: translateY(-4px); box-shadow: 0 12px 32px rgba(37,99,235,0.28); }
    .icon { width: 36px; height: 36px; color: var(--accent); stroke-width: 1.75; }
    .label { font-weight: 600; font-size: 0.95rem; line-height: 1.25; }
    .sub { font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="logo">Grok<span>Launchpad</span></div>
    <a class="back" href="index.html">← Back</a>
  </header>
  <h1>Social Media Bots</h1>
  <div class="grid">
    <a class="tile" href="https://grok.com" target="_blank"><i data-lucide="megaphone" class="icon"></i><div class="label">Head Social Media</div><div class="sub">Content calendar</div></a>
    <a class="tile" href="https://grok.com" target="_blank"><i data-lucide="twitter" class="icon"></i><div class="label">X Bot</div><div class="sub">Posts & threads</div></a>
    <a class="tile" href="https://grok.com" target="_blank"><i data-lucide="instagram" class="icon"></i><div class="label">Instagram Bot</div><div class="sub">Carousels & Reels</div></a>
    <a class="tile" href="https://grok.com" target="_blank"><i data-lucide="facebook" class="icon"></i><div class="label">Facebook Bot</div><div class="sub">Page posts</div></a>
    <a class="tile" href="https://grok.com" target="_blank"><i data-lucide="music" class="icon"></i><div class="label">TikTok Bot</div><div class="sub">Video scripts</div></a>
    <a class="tile" href="https://grok.com" target="_blank"><i data-lucide="at-sign" class="icon"></i><div class="label">Threads Bot</div><div class="sub">Casual posts</div></a>
    <a class="tile" href="https://grok.com" target="_blank"><i data-lucide="linkedin" class="icon"></i><div class="label">LinkedIn Bot</div><div class="sub">Professional posts</div></a>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
